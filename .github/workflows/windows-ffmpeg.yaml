name: M5 source regression

on:
  pull_request:
  push:
    branches: [feat/windows-ffmpeg-export]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Source package regression
        run: python tools/check_package.py
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Public-media regression
        run: python -m unittest discover -s tests -p test_public_media.py -v
